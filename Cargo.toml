[package]
name = "diskmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "See what's using your Mac's disk: a WinDirStat-style treemap of every file and folder."
license = "MIT"
repository = "https://github.com/theheadgeek/DiskMap"
authors = ["Inactive Node"]
keywords = ["disk-usage", "treemap", "macos", "windirstat", "egui"]
categories = ["command-line-utilities", "filesystem", "visualization"]

[dependencies]
eframe = "0.36.2"
pollster = "1.0.1"
rayon = "1.12.0"
rfd = "0.17.2"

# Used to point the menu bar's "About DiskMap" at DiskMap's own About window.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
