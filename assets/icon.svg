<!-- DiskMap app icon: the Inactive Node cube on a rounded tile.
     The cube is the corrected mark from Nodal's BrandCube.svelte (64×64 viewBox),
     scaled up; the tile uses the theme's surface colours and the red glow from
     the `shadow` token. Regenerate the PNG and .icns with scripts/make-icon.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1826"/>
      <stop offset="1" stop-color="#0b0a0f"/>
    </linearGradient>
    <radialGradient id="backglow" cx="512" cy="530" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d81f29" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d81f29" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emblem" cx="50%" cy="54%" r="52%">
      <stop offset="0%" stop-color="#F0343D" stop-opacity=".62"/>
      <stop offset="50%" stop-color="#B4141E" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#B4141E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile, inset to Apple's icon grid (824 px of 1024) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#backglow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#352b43" stroke-width="3"/>

  <!-- The cube: 64-unit mark scaled ×8.75 and centred -->
  <g transform="translate(232 231.25) scale(8.75)">
    <polygon points="32,3 58,18 32,33 6,18" fill="#17131F"/>
    <polygon points="6,18 32,33 32,61 6,46" fill="#0E0B14"/>
    <polygon points="58,18 58,46 32,61 32,33" fill="#0A0810"/>
    <path d="M32 33 L32 3 M32 33 L6 46 M32 33 L58 46" fill="none" stroke="#2F1D2B" stroke-width="1.1" opacity=".55"/>
    <circle cx="32" cy="33" r="16.5" fill="url(#emblem)"/>
    <circle cx="32" cy="33" r="14.5" fill="none" stroke="#D81F29" stroke-width="2.3" opacity=".7"/>
    <g stroke="#EE3A42" stroke-width="4.3" stroke-linecap="round">
      <path d="M24 24.5 L40 40.5"/>
      <path d="M40 24.5 L24 40.5"/>
    </g>
    <path d="M6 18 L32 33 M58 18 L32 33 M32 33 L32 61" fill="none" stroke="#4A2942" stroke-width="1.1" opacity=".85"/>
    <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="none" stroke="#4A2942" stroke-width="1.3"/>
  </g>
</svg>
